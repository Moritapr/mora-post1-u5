# ---------------------------------------------------------------------------
# ReservasLabs - Unidad 5 (Arquitectura en capas y MVC + REST)
# ---------------------------------------------------------------------------
spring.application.name=reservas-labs-api
server.port=8080

# --- Base de datos H2 en memoria -------------------------------------------
spring.datasource.url=jdbc:h2:mem:reservas_labs_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Consola web de H2: http://localhost:8080/h2-console --------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate --------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# La frontera HTTP nunca expone entidades gestionadas: el fetch se resuelve
# explicitamente en el repositorio, por eso se cierra la sesion en la vista.
spring.jpa.open-in-view=false

# --- Thymeleaf --------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# --- Mensajes de error ------------------------------------------------------
spring.mvc.problemdetails.enabled=false
server.error.include-message=always
